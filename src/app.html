<!doctype html>
<html
  lang="%classhub.lang%"
  data-theme="%classhub.theme%"
  data-mode="%classhub.mode%"
  data-density="%classhub.density%"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%classhub.favicon%" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="%classhub.themeColor%" />
    <meta name="apple-mobile-web-app-title" content="%classhub.shortName%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style nonce="%sveltekit.nonce%">
      #app {
        display: contents;
      }
      %classhub.accent%
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
